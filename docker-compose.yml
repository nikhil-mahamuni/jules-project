services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pranali_db
    restart: always
    environment:
      POSTGRES_DB: pranali
      POSTGRES_USER: pranali
      POSTGRES_PASSWORD: pranali
    ports:
      - "5432:5432"
    volumes:
      - pranali_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pranali_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pranali_postgres_data:
